name = "buyking-mcp"
main = "src/index.ts"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "buyking.saleplaza.com/*", zone_name = "saleplaza.com" }
]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "IpRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IpRateLimiter"]
